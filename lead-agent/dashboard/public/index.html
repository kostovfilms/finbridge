<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявки за клиенти</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Заявки за клиенти</h1>
  <div id="status" class="status"></div>
</header>
<section class="filters" aria-label="Филтри">
  <label>Пазар <select id="f-market"><option value="">Всички</option></select></label>
  <label>Ниша <select id="f-niche"><option value="">Всички</option></select></label>
  <label>Източник <select id="f-source"><option value="">Всички</option></select></label>
  <label>От <input type="date" id="f-from"></label>
  <label>До <input type="date" id="f-to"></label>
  <label class="grow">Търсене <input type="search" id="f-q" placeholder="дума в нуждата, града, автора"></label>
  <button type="button" id="f-reset">Изчисти</button>
</section>
<div class="bar">
  <span id="count"></span>
  <span class="links"><a href="/download/leads.csv">CSV</a> · <a href="/download/leads.xlsx">Excel</a></span>
</div>
<div class="table-wrap">
<table>
  <thead><tr>
    <th>Дата</th><th>Източник</th><th>Пазар</th><th>Ниша</th><th>Място</th><th>Нужда</th><th>Автор</th><th></th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<p id="empty" class="empty" hidden>Няма заявки. Пуснете <code>npm run start</code>.</p>
<script src="app.js"></script>
</body>
</html>
