<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinBridge Финанси</title>
<style>
:root{--bg:#f1f4f5;--surface:#fff;--surface-2:#e8edee;--line:#d3dbdd;--ink:#16252a;--muted:#5b6d73;--accent:#0e6b74;--accent-ink:#fff;--accent-soft:#d9eef0;--good:#1d7a46;--good-soft:#dcf1e4;--warn:#9a5b00;--warn-soft:#fbecd0;--crit:#b3261e;--crit-soft:#fbe0de}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1719;--surface:#172124;--surface-2:#1f2c30;--line:#2f4045;--ink:#e4ecee;--muted:#93a6ab;--accent:#4fc0c9;--accent-ink:#06262a;--accent-soft:#123a3f;--good:#6fd39a;--good-soft:#15382a;--warn:#f0b65a;--warn-soft:#40300f;--crit:#ff8f87;--crit-soft:#4a1c19}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Segoe UI",Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:16px;min-width:0}
.brand{font-weight:800;font-size:19px;padding:0 8px}.brand span{color:var(--accent)}.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface-2)}.nav a.on{background:var(--accent-soft);color:var(--accent)}
.count{font-size:12px;background:var(--crit-soft);color:var(--crit);border-radius:10px;padding:1px 7px}
.foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.main{padding:22px 28px 48px;min-width:0;display:flex;flex-direction:column;gap:16px}
h1{font-size:23px;line-height:1.2;margin:0}h2{font-size:16px;margin:0 0 10px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}.tile span{color:var(--muted);font-size:13px}.tile small{color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.small{padding:4px 9px;font-size:13px;font-weight:500}.btn.bad{color:var(--crit)}.btn:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12.5px;color:var(--muted);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.scroll{overflow-x:auto}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12.5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.info{background:var(--accent-soft);color:var(--accent)}
.dim{color:var(--muted);font-size:13px}.acts{display:flex;gap:6px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.form .full{grid-column:1/-1}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-width:0;width:100%}
.note{border-radius:8px;padding:10px 12px;font-size:14px}.note.info{background:var(--accent-soft)}.note.warn{background:var(--warn-soft);color:var(--warn)}.note.crit{background:var(--crit-soft);color:var(--crit)}.note.good{background:var(--good-soft);color:var(--good)}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--accent)}.bar i.over{background:var(--crit)}.bar i.near{background:var(--warn)}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select,.filters input{width:auto}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.doc{max-width:860px;padding:28px}.doc h1{letter-spacing:.04em}.doc .two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:18px 0}.doc .two h2{font-size:13px;color:var(--muted);text-transform:uppercase;margin:0 0 4px}
.doc .sum{margin:12px 0 12px auto;width:auto;min-width:300px}.doc .sum td{border:0;padding:3px 8px}.doc .sum tr:last-child td{font-weight:700;font-size:17px;border-top:2px solid var(--ink)}
.lines input{padding:6px 8px}
@media print{.rail,.noprint,.note{display:none!important}.app{display:block}.main{padding:0}body{background:#fff;color:#000}.doc{border:0;max-width:none;padding:0}}
@media (max-width:760px){.app{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line);padding:12px;gap:10px}.nav{flex-direction:row;overflow-x:auto}.foot{flex-direction:row;flex-wrap:wrap;gap:10px;margin:0}.main{padding:16px 12px 40px}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Fin<span>Bridge</span> Финанси<small id="firm"></small></div>
    <nav class="nav" id="nav" aria-label="Раздели"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main class="main" id="main" aria-live="polite"><p class="dim">Зареждане…</p></main>
</div>
<script>
/*FIN-START*/
const Fin = (() => {
  'use strict';
  const CATS = ['Гориво и транспорт', 'Материали и стоки', 'Външни услуги', 'Наем и режийни', 'Командировки', 'Реклама', 'Софтуер и абонаменти', 'Заплати и осигуровки', 'Данъци и такси', 'Други'];
  const DEFAULTS = { balance: 0, balanceDate: '', approverLimit: 0, receiptOver: 0, cats: CATS, seller: {}, invNext: 1 };
  const PAY = { own: 'Лични средства', card: 'Фирмена карта', cash: 'Каса', bank: 'Банков превод' };
  const STATUS = { submitted: 'Чака одобрение', approved: 'Одобрен', rejected: 'Отказан', paid: 'Платен', open: 'Неплатена', void: 'Анулирана', active: 'Активен' };
  const ROLES = { owner: 'Собственик', approver: 'Одобряващ', member: 'Служител', accountant: 'Счетоводител' };
  const r2 = n => Math.round(n * 100) / 100;
  const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  const dayDiff = (a, b) => Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 864e5);
  const money = n => (n < 0 ? '-' : '') + Math.abs(+n || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const spend = i => i.type === 'expense' || i.type === 'bill';
  const counted = i => i.status === 'approved' || i.status === 'paid';
  /* Остатък за плащане по запис с частични плащания. */
  const left = i => r2(i.amount - (i.paid || 0));

  /* Кой може да одобри или откаже заявка. */
  function canApprove(item, actor, set){
    if (actor.role === 'owner') return { ok: true };
    if (actor.role !== 'approver') return { ok: false, why: 'Само одобряващ или собственик може да решава заявки.' };
    if (item.owner === actor.id) return { ok: false, why: 'Не можете да решавате собствените си заявки.' };
    if (set.approverLimit > 0 && item.amount > set.approverLimit) return { ok: false, why: 'Сумата е над лимита ви за одобрение. Нужен е собственик.' };
    return { ok: true };
  }
  /* Бюджет важи за записите, изрично отнесени към него, а ако има категория и за неотнесените от същата категория. */
  const inBudget = (b, i) => spend(i) && (i.budget === b.id || (!i.budget && b.cat && i.cat === b.cat));
  function budgetUsage(items, period){
    return items.filter(b => b.type === 'budget').map(b => {
      const own = items.filter(i => inBudget(b, i) && String(i.date).slice(0, 7) === period);
      const spent = r2(own.filter(counted).reduce((s, i) => s + i.amount, 0)), pending = r2(own.filter(i => i.status === 'submitted').reduce((s, i) => s + i.amount, 0));
      return { id: b.id, name: b.name, cat: b.cat, limit: b.limit, spent, pending, left: r2(b.limit - spent), pct: b.limit ? Math.round(spent / b.limit * 100) : 0 };
    });
  }
  /* Предупреждения по правилата на фирмата за един разход или фактура. */
  function violations(item, items, set, today){
    const out = [];
    if (!spend(item)) return out;
    if (item.type === 'expense' && !item.file && item.amount > (+set.receiptOver || 0)) out.push('няма документ');
    if (today && item.date > today) out.push('бъдеща дата');
    if (items.some(o => o.id !== item.id && o.type === item.type && o.status !== 'rejected' && o.date === item.date && o.amount === item.amount && String(o.party).toLowerCase() === String(item.party).toLowerCase())) out.push('възможен дубликат');
    for (const b of items) if (b.type === 'budget' && inBudget(b, item)){
      const used = items.filter(i => i.id !== item.id && inBudget(b, i) && counted(i) && String(i.date).slice(0, 7) === String(item.date).slice(0, 7)).reduce((s, i) => s + i.amount, 0);
      if (r2(used + item.amount) > b.limit) out.push('над бюджета „' + b.name + '“');
    }
    return out;
  }
  /* Прогноза за наличността по седмици: вземания по падеж минус задължения по падеж; просрочените влизат в първата седмица. */
  function forecast(items, set, today, weeks){
    let bal = +set.balance || 0; const out = [];
    const due = i => i.due || i.date;
    for (let w = 0; w < (weeks || 8); w++){
      const start = addDays(today, 7 * w), end = addDays(start, 6), hit = i => (due(i) >= start && due(i) <= end) || (w === 0 && due(i) < start);
      const inc = items.filter(i => i.type === 'invoice' && i.status === 'open' && hit(i)).reduce((s, i) => s + left(i), 0);
      let exp = items.filter(i => i.type === 'bill' && (i.status === 'submitted' || i.status === 'approved') && hit(i)).reduce((s, i) => s + left(i), 0);
      if (w === 0) exp += items.filter(i => i.type === 'expense' && i.pay === 'own' && i.status === 'approved').reduce((s, i) => s + i.amount, 0);
      bal = r2(bal + inc - exp); out.push({ start, end, in: r2(inc), out: r2(exp), balance: bal });
    }
    return out;
  }
  /* Вземания по давност на просрочието. */
  function aging(items, today){
    const a = { notDue: 0, d30: 0, d60: 0, older: 0, total: 0, overdue: [] };
    for (const i of items) if (i.type === 'invoice' && i.status === 'open'){
      const late = dayDiff(today, i.due || i.date), rem = left(i); a.total += rem;
      if (late <= 0) a.notDue += rem; else { a[late <= 30 ? 'd30' : late <= 60 ? 'd60' : 'older'] += rem; a.overdue.push(Object.assign({ late, left: rem }, i)); }
    }
    for (const k of ['notDue', 'd30', 'd60', 'older', 'total']) a[k] = r2(a[k]);
    a.overdue.sort((x, y) => y.late - x.late); return a;
  }
  function byCat(items, period){
    const m = {}; for (const i of items) if (spend(i) && counted(i) && String(i.date).slice(0, 7) === period) m[i.cat || 'Без категория'] = r2((m[i.cat || 'Без категория'] || 0) + i.amount);
    return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([cat, sum]) => ({ cat, sum }));
  }
  function summary(items){
    const sum = f => r2(items.filter(f).reduce((s, i) => s + (i.status === 'submitted' ? i.amount : left(i)), 0)), n = f => items.filter(f).length;
    const wait = i => spend(i) && i.status === 'submitted', pay = i => (i.type === 'bill' && i.status === 'approved') || (i.type === 'expense' && i.pay === 'own' && i.status === 'approved');
    return { waitN: n(wait), waitSum: sum(wait), payN: n(pay), paySum: sum(pay), recvSum: sum(i => i.type === 'invoice' && i.status === 'open') };
  }
  /* Засичане с банката: плащане от извлечението затваря запис само при една възможна двойка с еднаква сума, близка дата и съвпадение по име или номер.
     Всичко останало се връща като предложение за потвърждение от човек. sim(a, b) връща сходство на имена от 0 до 1. */
  const fmtDate = d => d ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4) : '';
  const numKey = s => String(s || '').replace(/\D/g, '').replace(/^0+/, '');
  function matchBank(items, txs, sim){
    const used = new Set(), pairs = [];
    for (const i of items){ if (i.bankTx) used.add(i.bankTx); for (const p of i.pays || []) if (p.bank) used.add(p.bank); }
    const free = txs.filter(t => !used.has(t.key));
    const elig = i => (i.type === 'invoice' && i.status === 'open') || (i.type === 'bill' && (i.status === 'submitted' || i.status === 'approved')) || (i.type === 'expense' && i.status === 'approved' && (i.pay === 'card' || i.pay === 'bank'));
    for (const i of items){
      if (!elig(i)) continue;
      const sign = i.type === 'invoice' ? 1 : -1, win = i.type === 'expense' ? [-1, 7] : [-3, 120], num = numKey(i.number), rem = left(i);
      for (const t of free){
        const amt = Math.abs(t.amount), full = Math.abs(amt - rem) <= 0.011, part = !full && amt < rem && i.type !== 'expense';
        if (Math.sign(t.amount) !== sign || !(full || part) || (i.skip || []).includes(t.key)) continue;
        const lag = dayDiff(t.date, i.date); if (lag < win[0] || lag > win[1]) continue;
        const text = t.cp + ' ' + (t.desc || ''), byNum = num.length >= 3 && (text.match(/\d+/g) || []).some(x => x.replace(/^0+/, '') === num), strong = byNum || sim(i.party, text) >= 0.5;
        /* По-малка сума е вноска само ако името или номерът съвпадат. */
        if (part && !strong) continue;
        pairs.push({ i, t, lag, strong, byNum, part, amt });
      }
    }
    const n = (list, f, k) => list.filter(p => f(p) === k).length, byI = p => p.i.id, byT = p => p.t.key, held = p => p.i.noAuto || (p.i.type === 'bill' && p.i.status !== 'approved');
    const fulls = pairs.filter(p => !p.part), parts = pairs.filter(p => p.part), strong = fulls.filter(p => p.strong);
    const auto = strong.filter(p => n(strong, byI, p.i.id) === 1 && n(strong, byT, p.t.key) === 1 && !held(p));
    const doneI = new Set(auto.map(byI)), doneT = new Set(auto.map(byT)), sums = {};
    /* Вноска се отнася сама само по номер на фактурата и докато сборът не надхвърли остатъка. */
    for (const p of parts.filter(p => p.byNum && !held(p) && !doneI.has(p.i.id) && n(fulls, byT, p.t.key) === 0 && n(parts.filter(x => x.byNum), byT, p.t.key) === 1).sort((a, b) => a.t.date.localeCompare(b.t.date))){
      const sum = r2((sums[p.i.id] || 0) + p.amt); if (sum > left(p.i) + 0.011) continue;
      sums[p.i.id] = sum; auto.push(p); doneT.add(p.t.key);
    }
    const rest = pairs.filter(p => !auto.includes(p) && !doneI.has(p.i.id) && !doneT.has(p.t.key) && (p.part ? p.amt <= left(p.i) - (sums[p.i.id] || 0) + 0.011 && n(fulls, byT, p.t.key) === 0 && n(parts, byT, p.t.key) === 1 : p.strong || (n(fulls, byI, p.i.id) === 1 && n(fulls, byT, p.t.key) === 1)));
    rest.sort((a, b) => (b.strong - a.strong) || (a.part - b.part) || b.t.date.localeCompare(a.t.date) || a.lag - b.lag);
    return { auto: auto.map(p => ({ id: p.i.id, key: p.t.key, date: p.t.date, amount: p.amt, part: p.part })), suggest: rest.slice(0, 30).map(p => ({ id: p.i.id, key: p.t.key, date: p.t.date, cp: p.t.cp, amount: p.t.amount, strong: p.strong, part: p.part })) };
  }
  /* Готов текст за напомняне към клиент с просрочена фактура. */
  function dunningText(i, firm, cur, today){
    const due = i.due || i.date, late = dayDiff(today, due);
    return 'Здравейте,\n\nнапомняме Ви, че фактура' + (i.number ? ' № ' + i.number : '') + ' от ' + fmtDate(i.date) + ' на стойност ' + money(i.amount) + ' ' + cur + (i.paid > 0 ? ', от които остават за плащане ' + money(left(i)) + ' ' + cur + ',' : '') + ' беше с падеж ' + fmtDate(due) +
      (late > 0 ? ' и към днес е просрочена с ' + late + (late === 1 ? ' ден' : ' дни') : '') + '.\nМолим да наредите плащането. Ако вече сте платили, моля изпратете ни платежното нареждане.\n\nПоздрави,\n' + firm;
  }
  /* ---- издаване на фактури ---- */
  const REV = { '703': 'Услуги', '702': 'Стоки', '701': 'Продукция' }, RATES = [20, 9, 0];
  function invoiceTotals(lines, rate){
    const rows = (lines || []).map(l => { const qty = +l.qty || 0, price = +l.price || 0; return Object.assign({}, l, { qty, price, sum: r2(qty * price) }); });
    const net = r2(rows.reduce((s, l) => s + l.sum, 0)), vat = r2(net * (+rate || 0) / 100);
    return { rows, net, vat, total: r2(net + vat) };
  }
  const issuedIn = (items, period) => items.filter(i => i.type === 'invoice' && i.inv && String(i.date).slice(0, 7) === period).sort((a, b) => String(a.number).localeCompare(String(b.number)));
  /* Работен дневник на продажбите от издадените фактури за месеца. Анулираните остават с нулеви стойности, за да не се къса номерацията. */
  function salesLedger(items, period, dec){
    const num = n => n.toFixed(2).replace('.', dec || ','), rows = [['№', 'Вид', 'Номер', 'Дата', 'ДДС номер или ЕИК', 'Получател', 'Предмет', 'Данъчна основа', 'Ставка', 'ДДС', 'Общо', 'Основание за неначисляване', 'Състояние']];
    issuedIn(items, period).forEach((i, k) => { const v = i.status === 'void';
      rows.push([k + 1, 'Фактура', i.number, fmtDate(i.date), i.inv.buyer.vatNo || i.inv.buyer.eik, i.party, i.inv.lines[0] ? i.inv.lines[0].name : '', num(v ? 0 : i.inv.net), i.inv.rate + '%', num(v ? 0 : i.inv.vat), num(v ? 0 : i.amount), i.inv.vatNote || '', v ? 'Анулирана' : '']); });
    return rows;
  }
  /* Контировки за продажбите и постъпленията за месеца: 411 Клиенти, 70x приходи, 4532 ДДС на продажбите, 501 каса, 503 банка. */
  function salesPostings(items, period, dec){
    const num = n => n.toFixed(2).replace('.', dec || ','), rows = [['Дата', 'Вид документ', 'Номер', 'Контрагент', 'ЕИК', 'Основание', 'Дебит', 'Кредит', 'Сума']];
    for (const i of issuedIn(items, period)){
      if (i.status === 'void') continue;
      const dt = i.pay === 'cash' ? '501' : '411', head = [fmtDate(i.date), 'Фактура', i.number, i.party, i.inv.buyer.eik], what = 'Продажба: ' + (i.inv.lines[0] ? i.inv.lines[0].name : '');
      rows.push(head.concat([what, dt, i.inv.rev, num(i.inv.net)])); if (i.inv.vat) rows.push(head.concat(['ДДС по продажба', dt, '4532', num(i.inv.vat)]));
    }
    const pays = [];
    for (const i of items){
      if (i.type !== 'invoice' || i.pay === 'cash' || i.status === 'void') continue;
      for (const p of i.pays || []) pays.push([p.date, i, p.amount]);
      if (i.status === 'paid' && i.paidAt && left(i) > 0.011) pays.push([i.paidAt, i, left(i)]);
    }
    for (const [date, i, amount] of pays.filter(x => String(x[0]).slice(0, 7) === period && x[2] > 0).sort((a, b) => a[0].localeCompare(b[0])))

  if (f.id === 'user-form') return act(async () => { await api('POST', '/api/fin/users', v); S.users = await api('GET', '/api/fin/users'); }, 'Достъпът е създаден. Предайте паролата на човека.');
  if (f.id === 'set-form') return act(() => api('PUT', '/api/fin/settings', { data: Object.assign(v, { cats: v.cats.split('\n'), seller: { eik: v.s_eik, vatNo: v.s_vatNo, mol: v.s_mol, address: v.s_address, iban: v.s_iban, bank: v.s_bank, bic: v.s_bic } }) }), 'Правилата са записани.');
  if (f.id === 'issue-form'){ collectIssue(); return act(async () => { const it = await api('POST', '/api/fin/invoices', { data: S.issue }); S.issue = null; S.print = it.id; }, 'Фактурата е издадена.'); }
});
document.addEventListener('change', e => { if (e.target.id === 'f-status'){ S.filter.status = e.target.value; render(); }
  if (e.target.id === 'exp-period' && /^\d{4}-\d{2}$/.test(e.target.value)){ collectIssue(); S.expPeriod = e.target.value; render(); } });
document.addEventListener('input', e => {
  const f = e.target.closest && e.target.closest('#issue-form');
  if (f){
    collectIssue();
    /* Познат получател: попълва данните му от последната издадена фактура. */
    if (e.target.name === 'party'){ const c = customers().get(e.target.value); if (c) for (const k of ['eik', 'vatNo', 'address', 'mol']){ S.issue[k] = c[k] || ''; f.elements[k].value = c[k] || ''; } }
    const tt = issueTotals(); $('issue-totals').innerHTML = tt.html; f.querySelectorAll('[data-line-sum]').forEach((td, k) => { td.textContent = Fin.money(tt.t.rows[k].sum); });
    return;
  }
  if (e.target.id === 'f-q'){ S.filter.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('f-q'); n.focus(); n.setSelectionRange(pos, pos); } });
load().then(() => { const h = location.hash.slice(1); if (VIEWS.some(v => v[0] === h && v[2](role()))) return go(h); render(); }).catch(e => { $('main').innerHTML = '<div class="note crit">' + esc(e.message) + '</div>'; });
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (S.st && h !== S.view && VIEWS.some(v => v[0] === h && v[2](role()))) go(h); });
setInterval(() => { if (!S.form && !S.reject && !S.pay && !S.issue && !S.print && !S.busy && S.view !== 'team' && document.activeElement.id !== 'f-q') load().then(render).catch(() => {}); }, 20000);
})();
</script>
</body>
