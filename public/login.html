<!DOCTYPE html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FinBridge вход</title>
<style>
:root{--bg:#f1f4f5;--surface:#fff;--line:#d3dbdd;--ink:#16252a;--muted:#5b6d73;--accent:#0e6b74;--accent-ink:#fff;--crit:#b3261e}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1719;--surface:#172124;--line:#2f4045;--ink:#e4ecee;--muted:#93a6ab;--accent:#4fc0c9;--accent-ink:#06262a;--crit:#ff8f87}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Arial,sans-serif;display:flex;justify-content:center;padding:48px 16px}
main{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}h1{font-size:24px;margin:0}h1 span{color:var(--accent)}
form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.link{background:none;color:var(--accent);padding:0;font-weight:400;text-align:left}.err{color:var(--crit);min-height:1.4em;font-size:14px}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body><main>
<h1>Fin<span>Bridge</span></h1>
<form id="f" novalidate>
  <label id="office-row" hidden>Име на кантората<input id="office" name="office" autocomplete="organization"></label>
  <label>Имейл<input id="email" name="email" type="email" autocomplete="username" required></label>
  <label>Парола<input id="password" name="password" type="password" autocomplete="current-password" required></label>
  <div class="err" id="err" role="alert"></div>
  <button id="go" type="submit">Вход</button>
  <button class="link" id="swap" type="button" {{SIGNUP}}>Нова кантора? Създайте акаунт</button>
</form></main>
<script>
let reg = false; const $ = id => document.getElementById(id);
$('swap').onclick = () => { reg = !reg; $('office-row').hidden = !reg; $('go').textContent = reg ? 'Създай акаунт' : 'Вход'; $('swap').textContent = reg ? 'Имам акаунт, към вход' : 'Нова кантора? Създайте акаунт';
  $('password').autocomplete = reg ? 'new-password' : 'current-password'; $('err').textContent = ''; };
$('f').onsubmit = async e => { e.preventDefault(); $('err').textContent = ''; $('go').disabled = true;
  try { const r = await fetch(reg ? '/api/register' : '/api/login', { method: 'POST', headers: { 'content-type': 'application/json', 'x-fb': '1' },
      body: JSON.stringify({ office: $('office').value, email: $('email').value, password: $('password').value }) });
    if (r.ok) return location.href = '/'; $('err').textContent = (await r.json()).message || 'Неуспешно.'; }
  catch (x) { $('err').textContent = 'Няма връзка със сървъра.'; }
  $('go').disabled = false; };
</script></body></html>
